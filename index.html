<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<title>网格长个人看板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;min-height:100vh}
.login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.85);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:#fff;border-radius:16px;padding:40px 36px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center}
.login-box h2{font-size:20px;color:#1e293b;margin-bottom:6px}
.login-box p{font-size:13px;color:#64748b;margin-bottom:24px}
.login-box input{width:100%;padding:14px 16px;border:2px solid #e2e8f0;border-radius:10px;font-size:16px;text-align:center;outline:none}
.login-box input:focus{border-color:#3b82f6}
.login-box .btn{width:100%;padding:12px;background:#1e3a5f;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px}
.login-box .btn:hover{background:#2563eb}
.login-box .err{color:#dc2626;font-size:12px;margin-top:10px;min-height:18px}
.dashboard{display:none;padding:20px;max-width:1400px;margin:0 auto}
.header{background:#1e3a5f;color:#fff;padding:16px 24px;border-radius:10px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:18px;font-weight:700}
.header .meta{font-size:12px;opacity:0.7}
.header .logout{background:rgba(255,255,255,0.15);border:none;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px}
.section{background:#fff;border-radius:10px;padding:16px 20px;margin-bottom:16px;border:1px solid #e2e8f0}
.section h3{font-size:14px;font-weight:700;color:#1e293b;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f1f5f9}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi{text-align:center;padding:12px 8px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0}
.kpi .v{font-size:22px;font-weight:800;color:#1e293b}
.kpi .l{font-size:11px;color:#64748b;margin-top:4px}
.kpi.good .v{color:#059669}
.kpi.warn .v{color:#d97706}
.kpi.bad .v{color:#dc2626}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f1f5f9;color:#475569;padding:9px 10px;text-align:center;font-weight:600;border-bottom:2px solid #e2e8f0;position:sticky;top:0;white-space:nowrap}
td{padding:8px 10px;text-align:center;border-bottom:1px solid #f1f5f9}
tr:hover{background:#f8fafc}
.score-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-weight:700;font-size:12px}
.score-pill.high{background:#d1fae5;color:#065f46}
.score-pill.mid{background:#fef3c7;color:#92400e}
.score-pill.low{background:#fee2e2;color:#991b1b}
.admin-note{font-size:11px;color:#94a3b8;margin-top:8px}
</style>
</head><body>
<div class="login-overlay" id="loginOverlay">
<div class="login-box">
<h2>🔐 网格长个人看板</h2>
<p>输入你的6位密码登录</p>
<input type="text" id="pwdInput" placeholder="输入密码...">
<button class="btn" onclick="doLogin()">登 录</button>
<div class="err" id="errMsg"></div>
</div>
</div>
<div class="dashboard" id="dashboard">
<div class="header">
<div><h1 id="dashTitle">网格长个人看板</h1><div class="meta" id="dashMeta"></div></div>
<button class="logout" onclick="doLogout()">退出登录</button>
</div>
<div id="personalSection"></div>
<div class="section">
<div id="detailTable"></div>
</div>
<div class="admin-note">考核权重：订单达成50% + 闲置达成30% + 调度占比达成10% + 主管评分10%</div>
</div>

function initData(){
  var bin=atob(PWD_B64);
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  pwdMap=JSON.parse(pako.inflate(bytes,{to:"string"}));
  
  bin=atob(CITY_PWD_B64);
  bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  cityPwdMap=JSON.parse(pako.inflate(bytes,{to:"string"}));
  
  bin=atob(DATA_B64);
  bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  allRecords=JSON.parse(pako.inflate(bytes,{to:"string"}));
}
initData();

var currentUser=null;
var isAdmin=false;

function doLogin(){
  // 锁定检查
  var lockData=JSON.parse(localStorage.getItem('lr_lock')||'{"attempts":0,"lockUntil":0}');
  var now=Date.now();
  if(lockData.lockUntil>now){
    var mins=Math.ceil((lockData.lockUntil-now)/60000);
    document.getElementById("errMsg").textContent="输入错误过多，请"+mins+"分钟后再试";
    return;
  }
  var input=document.getElementById("pwdInput").value.trim();
  if(!input){document.getElementById("errMsg").textContent="请输入密码";return;}
  if(input==="admin2026"){localStorage.setItem('lr_lock',JSON.stringify({attempts:0,lockUntil:0}));isAdmin=true;currentUser="__admin__";showDashboard();return;}
  // 城市密码
  var foundCity=null;
  Object.keys(cityPwdMap).forEach(function(c){if(cityPwdMap[c]===input)foundCity=c;});
  if(foundCity){localStorage.setItem('lr_lock',JSON.stringify({attempts:0,lockUntil:0}));isAdmin=false;currentUser="__city__"+foundCity;showDashboard();return;}
  var found=null;
  Object.keys(pwdMap).forEach(function(name){if(pwdMap[name]===input)found=name;});
  if(found){localStorage.setItem('lr_lock',JSON.stringify({attempts:0,lockUntil:0}));isAdmin=false;currentUser=found;showDashboard();return;}
  // 错误计数
  lockData.attempts++;
  if(lockData.attempts>=5){lockData.lockUntil=now+30*60*1000;lockData.attempts=0;document.getElementById("errMsg").textContent="错误5次，锁定30分钟";}
  else{document.getElementById("errMsg").textContent="密码错误（还剩"+(5-lockData.attempts)+"次机会）";}
  localStorage.setItem('lr_lock',JSON.stringify(lockData));
}

function doLogout(){
  document.getElementById("loginOverlay").style.display="flex";
  document.getElementById("dashboard").style.display="none";
  currentUser=null;isAdmin=false;
  document.getElementById("pwdInput").value="";
}

function showDashboard(){
  document.getElementById("loginOverlay").style.display="none";
  document.getElementById("dashboard").style.display="block";
  if(isAdmin){renderAdmin();}
  else if(currentUser.startsWith("__city__")){renderCity(currentUser.replace("__city__",""));}
  else {renderPersonal(currentUser);}
}

function scoreClass(s){return s>=80?"high":s>=60?"mid":"low";}

function renderPersonal(name){
  var myData=allRecords.filter(function(r){return r.leader===name;});
  if(myData.length===0){document.getElementById("dashboard").innerHTML="<div style='padding:40px;text-align:center;color:#64748b'>暂无数据</div>";return;}
  var city=myData[0].city;
  document.getElementById("dashTitle").textContent=name+" · 个人看板";
  document.getElementById("dashMeta").textContent=city+" | "+myData.length+"条街道";
  
  // 计算城市内排名
  var cityLeaders={};
  allRecords.forEach(function(r){
    if(r.city!==city)return;
    if(!cityLeaders[r.leader])cityLeaders[r.leader]={scoreSum:0,count:0};
    cityLeaders[r.leader].scoreSum+=r.score;cityLeaders[r.leader].count++;
  });
  var rankList=[];
  Object.keys(cityLeaders).forEach(function(l){rankList.push({name:l,avg:cityLeaders[l].scoreSum/cityLeaders[l].count});});
  rankList.sort(function(a,b){return b.avg-a.avg;});
  var myRank=0,cityTotal=rankList.length;
  rankList.forEach(function(l,i){if(l.name===name)myRank=i+1;});
  
  // 汇总KPI
  var totalOrders=0,totalAv=0,totalDays=0;
  var scoreSum=0;
  myData.forEach(function(r){totalOrders+=r.daily_orders*r.days;totalAv+=r.av*r.days;totalDays+=r.days;scoreSum+=r.score;});
  var avgScore=scoreSum/myData.length;
  var avgTurn=totalAv>0?totalOrders/totalAv:0;
  
  var personalHtml='<div class="section"><h3>📊 月累计考核达成</h3><div class="kpi-grid">';
  personalHtml+='<div class="kpi" style="background:#1e3a5f;border:none"><div class="v" style="color:#fff;font-size:28px">第'+myRank+'名</div><div class="l" style="color:rgba(255,255,255,0.7)">城市排名(共'+cityTotal+'人)</div></div>';
  personalHtml+='<div class="kpi '+scoreClass(avgScore)+'"><div class="v">'+avgScore.toFixed(1)+'</div><div class="l">综合得分</div></div>';
  personalHtml+='<div class="kpi"><div class="v">'+(myData.reduce(function(s,r){return s+r.ach_orders;},0)/myData.length).toFixed(1)+'%</div><div class="l">订单达成(50%)</div></div>';
  personalHtml+='<div class="kpi"><div class="v">'+(myData.reduce(function(s,r){return s+r.ach_idle;},0)/myData.length).toFixed(1)+'%</div><div class="l">闲置达成(30%)</div></div>';
  personalHtml+='<div class="kpi"><div class="v">'+(myData.reduce(function(s,r){return s+r.ach_disp;},0)/myData.length).toFixed(1)+'%</div><div class="l">调度占比达成(10%)</div></div>';

function renderCity(city){
  document.getElementById("dashTitle").textContent=city+" · 城市视图";
  document.getElementById("dashMeta").textContent="查看"+city+"所有网格长数据";
  document.getElementById("personalSection").innerHTML="";
  
  var cityData=allRecords.filter(function(r){return r.city===city;});
  var leaders={};
  cityData.forEach(function(r){
    if(!leaders[r.leader]) leaders[r.leader]={streets:0,scoreSum:0,totalOrders:0,totalAv:0,totalDays:0};
    var l=leaders[r.leader];l.streets++;l.scoreSum+=r.score;l.totalOrders+=r.daily_orders*r.days;l.totalAv+=r.av*r.days;l.totalDays+=r.days;
  });
  var leaderList=[];
  Object.keys(leaders).forEach(function(name){
    var l=leaders[name];
    var avgScore=l.scoreSum/l.streets;
    var avgTurn=l.totalAv>0?l.totalOrders/l.totalAv:0;
    leaderList.push({name:name,streets:l.streets,score:avgScore,turn:avgTurn,totalAv:Math.round(l.totalAv/l.totalDays),totalOrders:Math.round(l.totalOrders/l.totalDays)});
  });
  leaderList.sort(function(a,b){return b.score-a.score;});
  
  var h1='<h3 style="font-size:14px;font-weight:700;color:#1e293b;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid #f1f5f9">👤 '+city+' 网格长排名</h3>';
  h1+='<div style="overflow-x:auto"><table><thead><tr><th>排名</th><th>网格长</th><th>管辖街道</th><th>日均可用</th><th>日均订单</th><th>翻台</th><th>综合得分</th></tr></thead><tbody>';
  leaderList.forEach(function(l,i){
    h1+='<tr><td>'+(i+1)+'</td><td><b>'+l.name+'</b></td><td>'+l.streets+'</td><td>'+l.totalAv+'</td><td>'+l.totalOrders+'</td><td>'+l.turn.toFixed(2)+'</td>';
    h1+='<td><span class="score-pill '+scoreClass(l.score)+'">'+l.score.toFixed(1)+'</span></td></tr>';
  });
  h1+='</tbody></table></div>';
  
  var sorted=cityData.slice().sort(function(a,b){return b.score-a.score;});
  var h2='<h3 style="font-size:14px;font-weight:700;color:#1e293b;margin:24px 0 10px;padding-bottom:8px;border-bottom:1px solid #f1f5f9">📋 '+city+' 街道明细</h3>';
  h2+='<div style="overflow-x:auto"><table><thead><tr><th>网格长</th><th>街道</th><th>日均可用</th><th>日均订单</th><th>翻台</th><th>1+闲置率</th><th>3+闲置率</th><th>调度占比</th><th>订单达成</th><th>闲置达成</th><th>调度达成</th><th>综合得分</th></tr></thead><tbody>';
  sorted.forEach(function(r){
    h2+='<tr><td>'+r.leader+'</td><td style="text-align:left">'+r.street+'</td><td>'+r.av+'</td><td>'+Math.round(r.daily_orders)+'</td><td>'+r.turn+'</td><td>'+r.i1r+'%</td><td>'+r.i3r+'%</td><td>'+r.disp_ratio+'%</td>';
    h2+='<td>'+r.ach_orders+'%</td><td>'+r.ach_idle+'%</td><td>'+r.ach_disp+'%</td>';
    h2+='<td><span class="score-pill '+scoreClass(r.score)+'">'+r.score+'</span></td></tr>';
  });
  h2+='</tbody></table></div>';
  
  document.getElementById("detailTable").innerHTML=h1+h2;

// 页面加载时检查锁定状态
(function(){
  var lockData=JSON.parse(localStorage.getItem('lr_lock')||'{"attempts":0,"lockUntil":0}');
  var now=Date.now();
  if(lockData.lockUntil>now){
    var mins=Math.ceil((lockData.lockUntil-now)/60000);
    document.getElementById("errMsg").textContent="输入错误过多，请"+mins+"分钟后再试";
    document.getElementById("pwdInput").disabled=true;
    setTimeout(function(){document.getElementById("pwdInput").disabled=false;document.getElementById("errMsg").textContent="";},lockData.lockUntil-now);
  }
})();
